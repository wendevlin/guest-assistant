<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- house, Home Assistant blue -->
  <path fill="#18BCF2" stroke="#18BCF2" stroke-width="6" stroke-linejoin="round"
        d="M10 62 L52 22 L94 62 L86 62 L86 110 L18 110 L18 62 Z"/>
  <!-- HA-style node circuit in the gable -->
  <g stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M52 70 V44 M52 58 L42 50 M52 54 L62 46"/>
  </g>
  <g fill="#fff">
    <circle cx="52" cy="40" r="4.5"/><circle cx="40" cy="48" r="4"/><circle cx="64" cy="44" r="4"/>
  </g>
  <!-- open doorway with warm light -->
  <path fill="#FFE7A3" d="M42 76 h20 v34 h-20 z"/>
  <!-- light spilling onto the ground -->
  <path fill="#FFE7A3" opacity=".4" d="M42 113 h20 l14 9 h-48 z"/>
  <!-- door swung open -->
  <path fill="#0F86AE" d="M62 76 L71 80 V114 L62 110 Z"/>
  <!-- guest arriving from outside -->
  <g fill="#F5A623">
    <circle cx="109" cy="82" r="7"/>
    <path d="M97 113 v-8 a12 12 0 0 1 24 0 v8 a3 3 0 0 1 -3 3 h-18 a3 3 0 0 1 -3 -3 z"/>
  </g>
</svg>
