name: Build

# Tests every push and pull request. Releases the app when main carries a
# `version` in guest_assistant/config.yaml that has no tag vX.Y.Z yet: builds
# the images, pushes them to ghcr.io/wendevlin/{arch}-guest-assistant:X.Y.Z and
# then creates the tag. The Supervisor offers the update as soon as the
# version is on main, so the images must follow without a manual step.
# Pushing a tag vX.Y.Z by hand releases as well.
#
# The guest frontend is not built here: it comes from the release of
# wendevlin/guest-assistant-frontend named in .github/frontend-release, and is
# only used if its SHA-256 matches .github/frontend-release.sha256
# (scripts/pin-frontend.sh writes both).
#
# Actions are pinned to commit SHAs; the comment names the tag.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  release:
    name: Release check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' guest_assistant/config.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "Tag $REF_NAME does not match version $version in guest_assistant/config.yaml" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != pull_request ] && [ "$REF" = refs/heads/main ]; then
            # Exit code 2: no such tag. Anything else but 0 is an error, not a release.
            code=0
            git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null || code=$?
            case $code in
              0) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
              2)
                echo "Version $version on main has no tag yet: releasing it"
                echo "publish=true" >> "$GITHUB_OUTPUT"
                ;;
              *) exit "$code" ;;
            esac
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Image (${{ matrix.arch }})
    needs: [test, release]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile

      - name: Download the guest frontend
        run: |
          release=$(cat .github/frontend-release)
          mkdir -p .build/frontend-dist
          curl -fsSL -o .build/guest-assistant-frontend.tar.gz \
            "https://github.com/wendevlin/guest-assistant-frontend/releases/download/${release}/guest-assistant-frontend.tar.gz"
          # A release asset can be replaced after it was published: unpack it
          # only if it is the one that was pinned.
          (cd .build && sha256sum --strict -c ../.github/frontend-release.sha256)
          tar -xzf .build/guest-assistant-frontend.tar.gz -C .build/frontend-dist

      - name: Package
        run: scripts/build-addon.sh --frontend .build/frontend-dist

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          docker build dist/addon/guest_assistant \
            --build-arg BUILD_ARCH="$ARCH" \
            --build-arg BUILD_VERSION="$VERSION" \
            --tag "ghcr.io/wendevlin/${ARCH}-guest-assistant:${VERSION}" \
            --tag "ghcr.io/wendevlin/${ARCH}-guest-assistant:latest"

      - name: Push
        if: needs.release.outputs.publish == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "ghcr.io/wendevlin/${ARCH}-guest-assistant:${VERSION}"
          docker push "ghcr.io/wendevlin/${ARCH}-guest-assistant:latest"

  tag:
    name: Tag release
    needs: [release, image]
    # Only after both images are pushed; a tag pushed with GITHUB_TOKEN does
    # not start another run.
    if: needs.release.outputs.publish == 'true' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Create tag
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
