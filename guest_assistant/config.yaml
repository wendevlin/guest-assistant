# Home Assistant app manifest. Installed from this repository, the Supervisor
# pulls the image that CI builds when this version reaches main (.github/workflows/build.yaml).
# scripts/build-addon.sh packages a local app instead: it drops the `image`
# line, so the Supervisor builds the Dockerfile on the device.
name: Guest Assistant
description: Give guests their own login to exactly one dashboard
version: "0.9.0"
slug: guest_assistant
url: https://github.com/wendevlin/guest-assistant
arch:
  - aarch64
  - amd64
init: false
startup: application
# Admin page inside HA; the app checks itself that the user is an administrator.
ingress: true
ingress_port: 8099
panel_icon: mdi:home-account
panel_title: Guest Assistant
panel_admin: true
# Host networking, so Guest Assistant can announce itself to the Home Assistant
# companion apps on the local network (mDNS; off unless the admin switches it
# on). Guests open port 3123 of the host, which is not behind HA's login; with
# host networking it cannot be remapped. The ingress port only answers the
# Supervisor (see src/admin/routes.ts).
host_network: true
# Lets the app create its own non-admin HA user through the Supervisor.
homeassistant_api: true
hassio_api: true
image: ghcr.io/wendevlin/{arch}-guest-assistant
