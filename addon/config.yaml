# Home Assistant app (add-on) manifest. Untested skeleton, see addon/README.md.
name: Guest Assistant
description: Give guests their own login to exactly one dashboard
version: "0.4.0"
slug: guest_assistant
url: https://github.com/wendevlin/guest-assistant
arch:
  - aarch64
  - amd64
init: false
startup: application
# Admin page inside HA; the app checks itself that the user is an administrator.
ingress: true
ingress_port: 8099
panel_icon: mdi:account-key
panel_title: Guest Assistant
panel_admin: true
# Port guests open. It is not behind HA's login.
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: Guest page
# Lets the app create its own non-admin HA user through the Supervisor.
homeassistant_api: true
hassio_api: true
image: "ghcr.io/wendevlin/{arch}-guest-assistant"
